services:
  app:
    build:
      context: .
    image: car-racing-rl-app
    #    container_name: car-racing-rl-container # removed for running multiple instances
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./images:/app/images
      - ./data:/app/data
    shm_size: '4gb'

    # docker compose run app python train_world_model_parallel.py --config test

    # Keep the container running if needed, or allow interactive sessions
    #    tty: true
    #    stdin_open: true

    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0', '1' ]
              #count: all
              capabilities: [ gpu ]
  mlflow-transformer:
    image: ghcr.io/mlflow/mlflow:latest
    #    user: "1000:1000"
    container_name: mlflow_ui
    ports:
      - "5555:5000"
    volumes:
      - ./logs/transformer_wm_logs/mlruns:/mlruns
    command: mlflow ui --backend-store-uri file:///mlruns --host 0.0.0.0
    restart: unless-stopped
  mlflow-gru:
    image: ghcr.io/mlflow/mlflow:latest
    #    user: "1000:1000"
    container_name: mlflow_ui
    ports:
      - "5555:5000"
    volumes:
      - ./logs/gru_wm_logs/mlruns:/mlruns
    command: mlflow ui --backend-store-uri file:///mlruns --host 0.0.0.0
    restart: unless-stopped

networks:
  default:
    driver: bridge
