<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing World Model</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="main-container">
    <h1>Car Racing World Model</h1>
    <div class="container">
        <div class="controls">
            <label for="model-select">Select Model:</label>
            <select id="model-select">
                <option value="gru">GRU</option>
                <option value="transformer">Transformer</option>
            </select>
            <button id="start-btn">Start Dream</button>
            <button id="reset-btn" disabled>Reset</button>
        </div>
        
        <div id="dream-container">
            <canvas id="dream-canvas" width="512" height="512"></canvas>
            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </div>
        <div id="status-message"></div>
        <div class="instructions">
            <p class="desktop-hint">Use Arrow Keys to Drive</p>
            <p class="touch-hint">Tap the controls below to drive</p>
        </div>
        <div class="touch-controls" aria-label="Touch driving controls">
            <div class="touch-group steering-group">
                <button class="control-btn" data-action="left" aria-label="Steer Left">
                    <span class="control-icon">◀</span>
                    <span class="control-label">Left</span>
                </button>
                <button class="control-btn" data-action="right" aria-label="Steer Right">
                    <span class="control-icon">▶</span>
                    <span class="control-label">Right</span>
                </button>
            </div>
            <div class="touch-group throttle-group">
                <button class="control-btn" data-action="up" aria-label="Accelerate">
                    <span class="control-icon">▲</span>
                    <span class="control-label">Gas</span>
                </button>
                <button class="control-btn" data-action="down" aria-label="Brake">
                    <span class="control-icon">▼</span>
                    <span class="control-label">Brake</span>
                </button>
            </div>
        </div>
    </div>
</div>
<script src="/static/script.js"></script>
</body>
</html>
